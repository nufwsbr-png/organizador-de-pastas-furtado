name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: Cria a tag da versão (o GitHub exige tag para release publicada)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v1.0.${{ github.run_number }}"
          git push origin "v1.0.${{ github.run_number }}"
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Publica a release com o instalador e o latest.yml (electron-updater lê daqui)
        run: >
          gh release create "v1.0.${{ github.run_number }}"
          release/*.exe release/*.blockmap release/latest.yml
          --title "1.0.${{ github.run_number }}"
          --notes "Build automática do commit ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
